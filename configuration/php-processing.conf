    # No path-info: /login.php/x.php is not login.php with extra path, it is
    # a file which does not exist, so try_files below gives 404.  With
    # fastcgi_split_path_info, such a URL ran login.php but missed the
    # locations in virtualhost-common.conf which match exact names
    # (e.g. the auth_limit rate limit on login.php).  Nothing uses path-info.
    fastcgi_pass unix:/var/run/php-fpm.sock;
    fastcgi_index index.php;
    fastcgi_param SCRIPT_FILENAME $request_filename;
    include fastcgi_params;
    # PHP is only served over https; behind a proxy that ends TLS, $scheme is http
    # (include/bot-gate.php and include/freshports.php set cookies Secure only for https)
    fastcgi_param REQUEST_SCHEME https;
    fastcgi_param HTTPS          on;
    try_files $fastcgi_script_name =404;
